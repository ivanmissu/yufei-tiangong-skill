<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Yufei Tiangong Skill workflow</title>
  <desc id="desc">从场景构想到参数锁定、视角路由、尺度审计、提供方适配与最终图像或视频提示词的五步工作流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7f5"/>
      <stop offset="1" stop-color="#e8efec"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#78918b"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" fill="#122326" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="40" font-weight="700">从一句构想到可生成画面</text>
  <text x="60" y="102" fill="#607773" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="2">LOCK → ROUTE → BUILD → AUDIT → ADAPT</text>

  <g transform="translate(60 152)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <path d="M196 92 H230 M426 92 H460 M656 92 H690 M886 92 H920" stroke="#78918b" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect width="170" height="184" rx="18" fill="#102327"/>
      <text x="22" y="38" fill="#cbb17b" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01 / LOCK</text>
      <text x="22" y="82" fill="#f3f6f4" font-size="24" font-weight="700">参数锁定</text>
      <text x="22" y="119" fill="#afc0bc" font-size="18">主体 · 画幅</text>
      <text x="22" y="148" fill="#afc0bc" font-size="18">人物 · 光色</text>
    </g>
    <g transform="translate(230)">
      <rect width="170" height="184" rx="18" fill="#ffffff" stroke="#bfd0cb"/>
      <text x="22" y="38" fill="#8f6938" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02 / ROUTE</text>
      <text x="22" y="82" fill="#193033" font-size="24" font-weight="700">唯一视角</text>
      <text x="22" y="119" fill="#607773" font-size="18">十种机位</text>
      <text x="22" y="148" fill="#607773" font-size="18">单一透视</text>
    </g>
    <g transform="translate(460)">
      <rect width="170" height="184" rx="18" fill="#ffffff" stroke="#bfd0cb"/>
      <text x="22" y="38" fill="#8f6938" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03 / BUILD</text>
      <text x="22" y="82" fill="#193033" font-size="24" font-weight="700">空间编译</text>
      <text x="22" y="119" fill="#607773" font-size="18">四至五层</text>
      <text x="22" y="148" fill="#607773" font-size="18">尺度证据链</text>
    </g>
    <g transform="translate(690)">
      <rect width="170" height="184" rx="18" fill="#ffffff" stroke="#bfd0cb"/>
      <text x="22" y="38" fill="#8f6938" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04 / AUDIT</text>
      <text x="22" y="82" fill="#193033" font-size="24" font-weight="700">硬约束审计</text>
      <text x="22" y="119" fill="#607773" font-size="18">人物比例</text>
      <text x="22" y="148" fill="#607773" font-size="18">透视 · 光向</text>
    </g>
    <g transform="translate(920)">
      <rect width="170" height="184" rx="18" fill="#9f4b42"/>
      <text x="22" y="38" fill="#f0d7a2" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">05 / ADAPT</text>
      <text x="22" y="82" fill="#ffffff" font-size="24" font-weight="700">工具适配</text>
      <text x="22" y="119" fill="#f2ded9" font-size="18">图像 · 视频</text>
      <text x="22" y="148" fill="#f2ded9" font-size="18">或仅提示词</text>
    </g>
  </g>
</svg>
